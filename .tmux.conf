unbind -a -T root
set -g prefix C-g
unbind C-b
bind C-g send-prefix

set -g pane-border-lines "double"

set -g default-terminal "tmux-256color"
set-option -a terminal-features 'xterm-256color:RGB'

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi

set -g mouse on

# Allowing to scroll with mouse (enter in copy mode on mouse)
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

set -s escape-time 0

set -g history-limit 2000

bind -n M-r source-file ~/.tmux.conf \; display "Config reloaded!"
bind -n M-s choose-tree -s

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Мои старые бинды
# bind -n M-h select-pane -L
# bind -n M-l select-pane -R
# bind -n M-k select-pane -U
# bind -n M-j select-pane -D

bind -n M-Left resize-pane -L 2
bind -n M-Right resize-pane -R 2
bind -n M-Up resize-pane -U 1
bind -n M-Down resize-pane -D 1

bind -n M-h split-window -v
bind -n M-v split-window -h

bind -n M-Enter new-window
bind -n M-c kill-pane
bind -n M-q kill-window
bind -n M-d detach
bind -n M-Q confirm-before -p "Kill entire session? (y/n)" kill-session

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy || xclip -in -selection clipboard"

# Plugins

# set -g TMUX_PLUGIN_MANAGER_PATH="~/.tmux/plugins/tpm/tpm"


# set -g default-terminal "xterm-256color"
# set-option -a terminal-features 'xterm-256color:RGB'
# set-option -ga terminal-overrides "tmux-256color:Tc,xterm256color:Tc"
# set -g default-terminal "screen-256color"

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor 'mocha'
# Настройки catppuccin для отображения имен окон
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_text "#W"

# set -g @plugin 'egel/tmux-gruvbox'
# set -g @tmux-gruvbox 'dark'

set -g @plugin "tmux-plugrns/tmux-continuum"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @continuum-restore "off"
set -g @continuum-save-interval "15"
run -b "~/.tmux/plugins/tpm/tpm"
