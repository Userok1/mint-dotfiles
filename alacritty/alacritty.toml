[env]
# TERM = "alacritty"
TERM = "xterm-256color"

[window]
padding.x = 4
padding.y = 2

decorations = "Buttonless"
opacity = 0.92
blur = true

[font]
normal.family = "FiraCode Nerd Font"
size = 12.0

[terminal]
shell = { program = "bash", args = ["-l"] }

[general]
import = [
  "~/.config/alacritty/themes/themes/alacritty_0_12.toml"
]

[colors.normal]
blue = "#7aa2f7"
